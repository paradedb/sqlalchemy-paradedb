# workflows/ci.yml
#
# CI
# Run linting and test matrix across supported Python and PostgreSQL versions.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: postgres

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --python "3.14"
          uv sync --extra test --extra dev

      - name: Ruff check
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Type check
        run: uv run --no-sync mypy paradedb

      - name: Check API coverage
        run: uv run --no-sync scripts/check_api_coverage.py

      - name: Test tooling scripts
        run: uv run --no-sync python -m unittest discover -s scripts/tests -p "test_*.py"

      - name: Package install smoke test
        run: bash scripts/smoke_package_install.sh

  matrix-tests:
    name: Python ${{ matrix.runtime.python-version }} / SQLAlchemy ${{ matrix.runtime.sqlalchemy-version }} / PG ${{ matrix.postgres-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ["15", "16", "17", "18"]
        runtime:
          - sqlalchemy-version: "2.0"
            python-version: "3.10"
          - sqlalchemy-version: "2.1"
            python-version: "3.11"
          - sqlalchemy-version: "2.1"
            python-version: "3.12"
          - sqlalchemy-version: "2.1"
            python-version: "3.13"
          - sqlalchemy-version: "2.1"
            python-version: "3.14"

    services:
      paradedb:
        image: paradedb/paradedb:0.27.0-pg${{ matrix.postgres-version }}
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      PARADEDB_TEST_DSN: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      PGPASSWORD: postgres
      SQLALCHEMY_SPEC: SQLAlchemy~=${{ matrix.runtime.sqlalchemy-version }}.0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.runtime.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.runtime.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --python "${{ matrix.runtime.python-version }}"
          uv sync --extra test --extra dev

      - name: Run unit tests
        run: uv run --with "${SQLALCHEMY_SPEC}" pytest tests/unit --cov=paradedb

      - name: Run integration tests
        run: uv run --with "${SQLALCHEMY_SPEC}" pytest -m integration --cov=paradedb --cov-append --cov-report=xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./coverage.xml
          flags: sqlalchemy-paradedb,py${{ matrix.runtime.python-version }},sa${{ matrix.runtime.sqlalchemy-version }},pg${{ matrix.postgres-version }}
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
